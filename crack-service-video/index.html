<style>
  :root {
    --bg: #0e0e11;
    --panel: #18181d;
    --line: #2b2b33;
    --text: #ececf0;
    --muted: #a0a0ab;
    --faint: #6c6c78;
    --accent: #ffd21a;
    --focus: #6cc8ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    min-height: 100vh;
  }
  .app { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 14px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
  .head p { margin: 0; font-size: 12px; color: var(--muted); }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border-radius: 10px; overflow: hidden;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .big-play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 92px; height: 92px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255, 255, 255, .94); color: #111; display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  .big-play svg { width: 34px; height: 34px; margin-left: 5px; }
  .big-play[hidden] { display: none; }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 14px; background: #000;
  }
  .loading[hidden] { display: none; }

    for (let i = seam.length - 1; i >= 0; i--) ctx.lineTo(seam[i][0] + off * 1.6, seam[i][1] + off * 0.9);

  }

  ctx.save();
  ctx.beginPath(); ctx.moveTo(x0 - size, -size * 2);
  seam.forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.lineTo(x0 - size, size); ctx.closePath(); ctx.clip();
  ctx.fillText('crack', x0, dy);
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x0 + w + size, -size * 2);
  seam.forEach(([x, y]) => ctx.lineTo(x + off * 1.6, y + off * 0.9));

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++, wi++) {
      const x = -gw / 2 + c * (cw + gap), y = -gh / 2 + r * (ch + gap);
      const d = Math.hypot(x + cw / 2, y + ch / 2) / maxD;
      const k = prog(t, d * 0.55, 0.55);
      if (k <= 0) continue;
      const xk = Ease.inCubic(prog(t, 2.72 + (c / cols) * 0.2 + (r / rows) * 0.06, 0.48));
      const s = lerp(0.6, 1, Ease.outBack(k));
      ctx.save();
      ctx.translate(x + cw / 2, y + ch / 2 + xk * 950);
      ctx.rotate(xk * (c % 2 ? 0.35 : -0.35));
      ctx.scale(s, s);
      ctx.globalAlpha = A0 * clamp(k * 2) * (1 - 0.55 * dim);
      fillRR(ctx, -cw / 2, -ch / 2, cw, ch, 12, C.tile);
      dot(ctx, -cw / 2 + 42, 0, 17, C.tileMark);
      ctx.font = fJP(900, 42); ctx.fillStyle = C.tileText; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillText(GRAY_WORDS[wi % GRAY_WORDS.length], -cw / 2 + 80, 3);
      fillRR(ctx, -cw / 2 + 82, 34, 110, 8, 4, C.tileMark);
      ctx.restore();
    }
  }
  ctx.restore();
  const ga = dim * (1 - prog(t, 2.75, 0.4));
  if (ga > 0) {
    const g = ctx.createRadialGradient(W / 2, 540, 0, W / 2, 540, 900);
    g.addColorStop(0, rgba(C.plasterLight, 0.96 * ga));
    g.addColorStop(0.55, rgba(C.plasterLight, 0.62 * ga));
    g.addColorStop(1, rgba(C.plasterLight, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  tline(ctx, t, '業界のイメージを、変えたい。', W / 2, 578, { font: fJP(900, 104), size: 104, align: 'center', t0: 0.45, out: 2.72 });
}

function grayHeads(ctx, t) {
  const n = 11, sp = 150, ground = 1120, r = 30, bodyH = 340, mid = 5;
  const lift = 2 * (2 * r + r * 0.3 + 4); // 頭ふたつ分
  const grow = Ease.outBack(prog(t, 4.1, 0.85)) * lift;
  const inkK = Ease.outCubic(prog(t, 4.1, 0.45));
  for (let i = 0; i < n; i++) {
    const x = W / 2 + (i - mid) * sp;
    const kin = Ease.outCubic(prog(t, 2.85 + Math.abs(i - mid) * 0.045, 0.6));
    const kout = Ease.inCubic(prog(t, 5.72 + Math.abs(i - mid) * 0.03, 0.45));
    ctx.save();
    ctx.translate(0, (1 - kin) * 480 + kout * 560);
    figure(ctx, x, ground, r, bodyH + (i === mid ? grow : 0), i === mid ? mix(C.figure, C.ink, inkK) : C.figure);
    ctx.restore();
  }
  const headTop = ground - bodyH - r * 0.3 - 2 * r;
  const gk = Ease.outCubic(prog(t, 4.7, 0.6)) * (1 - Ease.inCubic(prog(t, 5.62, 0.3)));
  if (gk > 0) {
    ctx.save();
    ctx.globalAlpha *= gk;
    ctx.strokeStyle = rgba(C.ink, 0.4); ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(150, headTop); ctx.lineTo(150 + (W - 300) * gk, headTop); ctx.stroke();
    ctx.setLineDash([]);
    const bx = W / 2 + 92, top2 = headTop - lift;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx, headTop); ctx.lineTo(bx + 18, headTop);
    ctx.moveTo(bx + 18, headTop); ctx.lineTo(bx + 18, lerp(headTop, top2, gk));
    ctx.moveTo(bx + 4, headTop - lift / 2); ctx.lineTo(bx + 18, headTop - lift / 2);
    ctx.moveTo(bx, top2); ctx.lineTo(bx + 18, top2);
    ctx.stroke();
    ctx.font = fJP(900, 40); ctx.fillStyle = C.ink; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillText('頭二つ', bx + 38, headTop - lift / 2 + 2);
    ctx.restore();
  }
  tline(ctx, t, '業界で、頭二つ抜けたい。', W / 2, 252, { font: fJP(900, 104), size: 104, align: 'center', t0: 3.3, out: 5.7 });
}

function grayNetwork(ctx, t) {
  const A0 = ctx.globalAlpha;
  // 線
  const all = [...NET.nodes.map((n, i) => ({ ...n, r: NET.nr, t0: 6.05 + i * 0.1 })), ...NET.small.map((n, i) => ({ ...n, t0: 6.3 + n.d * 0.7 }))];
  ctx.lineWidth = 2;
  for (const n of all) {
    const k = Ease.outCubic(prog(t, n.t0 + 0.15, 0.6));
    if (k <= 0) continue;
    ctx.strokeStyle = rgba(C.ink, n.label ? 0.22 : 0.13);
    ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(lerp(n.x, NET.cx, k), lerp(n.y, NET.cy, k)); ctx.stroke();
  }
  // 選ばれてきた証（点が中心へ集まる）
  let bump = 0;
  for (const p of PULSES) {
    const k = prog(t, p.t0, p.dur);
    if (k > 0 && k < 1) {
      const e = Ease.inOutCubic(k);
      dot(ctx, lerp(p.src.x, NET.cx, e), lerp(p.src.y, NET.cy, e), 6, C.ink);
    }
    const ta = p.t0 + p.dur;
    if (t > ta) bump += 0.05 * Math.exp(-(t - ta) * 7);
  }
  // 小さな人々
  for (const n of NET.small) {
    const k = Ease.outBack(prog(t, 6.3 + n.d * 0.7, 0.45));
    if (k > 0) dot(ctx, n.x, n.y, n.r * k, C.node);
  }
  // 取引先
  NET.nodes.forEach((n, i) => {
    const k = Ease.outBack(prog(t, 6.05 + i * 0.1, 0.5));
    if (k <= 0) return;
    ctx.save();
    ctx.translate(n.x, n.y); ctx.scale(k, k);
    dot(ctx, 0, 0, NET.nr, C.node);
    ctx.font = fJP(900, n.label.length > 2 ? 30 : 36); ctx.fillStyle = C.nodeText;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.label, 0, 2);
    ctx.restore();
  });
  // 自社
  const kc = Ease.outBack(prog(t, 5.85, 0.55));
  if (kc > 0) {
    const quiver = t > 9.35 && t < 9.66 ? Math.sin(t * 160) * 4 : 0;
    ctx.save();
    ctx.translate(NET.cx + quiver, NET.cy);
    ctx.scale(kc * (1 + Math.min(0.12, bump)), kc * (1 + Math.min(0.12, bump)));
    dot(ctx, 0, 0, NET.cr, '#B3B3AB');
    ctx.font = fJP(900, 50); ctx.fillStyle = '#66665F'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('自社', 0, 3);
    ctx.restore();
  }
  ctx.globalAlpha = A0;
  tline(ctx, t, '会社が続いているのは、', W / 2, 172, { font: fJP(900, 58), size: 58, align: 'center', t0: 6.2, color: rgba(C.ink, 0.82) });
  tline(ctx, t, '誰かに選ばれてきたから。', W / 2, 296, { font: fJP(900, 100), size: 100, align: 'center', t0: 7.6 });
}

function grayCrack(ctx, t) {
  const p = Ease.outCubic(prog(t, 9.66, 0.46));
  const glow = Ease.inOutCubic(prog(t, 9.9, 0.35));
  drawCrack(ctx, CRACK1, p, glow);
  // 砕けた破片
  const dt = t - 9.66;
  if (dt > 0 && dt < 1.4) {
    ctx.save();
    for (const d of DUST) {
      const x = NET.cx + d.vx * dt, y = NET.cy + d.vy * dt + 900 * dt * dt;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(d.rot + d.vr * dt);
      ctx.globalAlpha *= clamp(1.4 - dt);
      ctx.fillStyle = '#A9A9A1';
      ctx.beginPath(); ctx.moveTo(-d.r, -d.r * 0.6); ctx.lineTo(d.r, -d.r * 0.2); ctx.lineTo(-d.r * 0.2, d.r); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
}

/* ---- 10.2〜21.5 クラインブルー：ロゴ → 社外への調査 → 100ページのレポート ---- */
function sceneKlein(ctx, t) {
  bgFlat(ctx, C.klein, C.kleinLight);
  const burstA = 1 - Ease.inOutCubic(prog(t, 12.3, 1.0));
  drawBurst(ctx, BURST1, t, 10.22, burstA);

  // ロゴ：中央で割れて、左上の小さなロゴへ
  const lw = measure(ctx, fEN(800, 280), 'crack');
  const m = Ease.inOutCubic(prog(t, 11.9, 0.65));
  const s = lerp(1, BUG.size / 280, m);
  ctx.save();
  ctx.translate(lerp(W / 2, BUG.x + (lw * BUG.size / 280) / 2, m), lerp(632, BUG.y, m));
  ctx.scale(s, s);
  wordmark(ctx, t, 280, C.white, 10.55, 11.2);
  ctx.restore();

  kleinNetwork(ctx, t);
  if (t > 14.95) kleinReport(ctx, t);

  tline(ctx, t, '顧客、提携先、仕入れ先へ。', W / 2, 930, { font: fJP(700, 36), size: 36, align: 'center', t0: 12.4, out: 14.85, color: rgba(C.white, 0.86) });
  tline(ctx, t, '社外への徹底調査で、価値を掘り起こす。', W / 2, 1012, { font: fJP(900, 64), size: 64, align: 'center', t0: 12.55, out: 14.85, color: C.white });
}

function speechBubble(ctx, w, h, color, lineColor) {
  ctx.beginPath();
  rrPath(ctx, -w / 2, -h / 2, w, h, 14);
  ctx.moveTo(-w * 0.18, h / 2 - 1); ctx.lineTo(-w * 0.3, h / 2 + 16); ctx.lineTo(-w * 0.02, h / 2 - 1);
  ctx.fillStyle = color; ctx.fill();
  for (let i = 0; i < 3; i++) fillRR(ctx, -w / 2 + 14, -h / 2 + 13 + i * 13, (w - 28) * (i === 2 ? 0.55 : 1), 6, 3, lineColor);
}

function kleinNetwork(ctx, t) {
  const fade = 1 - Ease.inOutCubic(prog(t, 14.9, 0.45));
  if (fade <= 0 || t < 12.1) return;
  const A0 = ctx.globalAlpha;
  ctx.globalAlpha = A0 * fade;
  ctx.lineWidth = 2;
  NET.nodes.forEach((n, i) => {
    const k = Ease.outCubic(prog(t, 12.3 + i * 0.08, 0.6));
    if (k <= 0) return;
    ctx.strokeStyle = rgba(C.white, 0.4);
    ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(lerp(n.x, NET.cx, k), lerp(n.y, NET.cy, k)); ctx.stroke();
  });
  for (const n of NET.small) {
    const k = Ease.outCubic(prog(t, 12.4 + n.d * 0.5, 0.5));
    if (k <= 0) continue;
    ctx.strokeStyle = rgba(C.white, 0.16);
    ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(lerp(n.x, NET.cx, k), lerp(n.y, NET.cy, k)); ctx.stroke();
    dot(ctx, n.x, n.y, n.r * Ease.outBack(k), rgba(C.white, 0.38));
  }
  // 取材の吹き出し
  let bump = 0;
  for (const b of BUBBLES) {
    const k = prog(t, b.t0, 1.3);
    if (k <= 0) continue;
    const dir = Math.atan2(b.n.y - NET.cy, b.n.x - NET.cx);
    const px = b.n.x + Math.cos(dir) * 118 + (b.j - 1) * 26, py = b.n.y - 96 + (b.j - 1) * 12;
    const pop = Ease.outBack(prog(t, b.t0, 0.3));
    const fly = Ease.inOutCubic(prog(t, b.t0 + 0.55, 0.55));
    if (fly >= 1) { bump += 0.07 * Math.exp(-(t - b.t0 - 1.1) * 7); continue; }
    const cx = lerp(px, NET.cx, fly), cy = lerp(py, NET.cy, fly) - Math.sin(fly * Math.PI) * 60;
    ctx.save();
    ctx.translate(cx, cy);
    const sc = pop * lerp(1, 0.25, fly);
    ctx.scale(sc, sc);
    speechBubble(ctx, 104, 64, C.white, rgba(b.n.col === C.lemon ? C.orange : b.n.col, 0.9));
    ctx.restore();
  }
  NET.nodes.forEach((n, i) => {
    const k = Ease.outBack(prog(t, 12.25 + i * 0.09, 0.5));
    if (k <= 0) return;
    ctx.save();
    ctx.translate(n.x, n.y); ctx.scale(k, k);
    dot(ctx, 0, 0, NET.nr, n.col);
    ctx.font = fJP(900, n.label.length > 2 ? 30 : 36); ctx.fillStyle = n.tc;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.label, 0, 2);
    ctx.restore();
  });
  ctx.globalAlpha = A0;
  // 自社（この円がそのままレポートに変わる）
  if (t < 15.0) {
    const k = Ease.outBack(prog(t, 12.15, 0.55));
    if (k > 0) {
      const s = k * (1 + Math.min(0.14, bump));
      ctx.save();
      ctx.translate(NET.cx, NET.cy); ctx.scale(s, s);
      dot(ctx, 0, 0, NET.cr, C.white);
      ctx.font = fJP(900, 50); ctx.fillStyle = C.klein; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('自社', 0, 3);
      ctx.restore();
    }
  }
}

function reportPage(ctx, w, h, pageNo, contentA) {
  const x = -w / 2, y = -h / 2;
  ctx.fillStyle = C.white;
  ctx.fillRect(x, y, w, h);
  if (contentA <= 0) return;
  const A0 = ctx.globalAlpha;
  ctx.globalAlpha = A0 * contentA;
  ctx.fillStyle = C.klein; ctx.fillRect(x, y, w, 10);
  ctx.font = fJP(900, 24); ctx.fillStyle = C.klein; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillText('調査レポート', x + 36, y + 62);
  fillRR(ctx, x + 36, y + 84, w * 0.62, 16, 4, '#D9DCE6');
  fillRR(ctx, x + 36, y + 110, w * 0.44, 16, 4, '#D9DCE6');
  const gy = y + 150, gh = h * 0.28;
  const g = ctx.createLinearGradient(x + 36, gy, x + w - 36, gy + gh);
  g.addColorStop(0, C.rose); g.addColorStop(1, C.orange);
  ctx.fillStyle = g; ctx.fillRect(x + 36, gy, w - 72, gh);
  dot(ctx, x + w - 112, gy + gh * 0.46, gh * 0.26, C.lemon);
  let ly = gy + gh + 34;
  for (let i = 0; i < 5; i++) { fillRR(ctx, x + 36, ly, (w - 72) * (i % 3 === 2 ? 0.6 : 0.95), 9, 3, '#E3E5EC'); ly += 22; }
  const bx = x + 36, by = y + h - 52;
  [0.5, 0.8, 0.35, 0.95, 0.65].forEach((v, i) => { ctx.fillStyle = i === 3 ? C.klein : '#C9CEDF'; ctx.fillRect(bx + i * 30, by - v * 76, 20, v * 76); });
  const dx = x + w - 92, dyy = y + h - 96;
  let a0 = -Math.PI / 2;
  ctx.lineWidth = 20;
  for (const [c, f] of [[C.klein, 0.42], [C.lemon, 0.23], [C.viridian, 0.2], [C.rose, 0.15]]) {
    ctx.beginPath(); ctx.arc(dx, dyy, 42, a0, a0 + f * TAU); ctx.strokeStyle = c; ctx.stroke(); a0 += f * TAU;
  }
  ctx.font = fJP(700, 18); ctx.fillStyle = '#8A8FA0'; ctx.textAlign = 'center';
  ctx.fillText('P.' + pageNo, 0, y + h - 18);
  ctx.globalAlpha = A0;
}

function kleinReport(ctx, t) {
  const e = Ease.inOutCubic(prog(t, 15.0, 0.9));
  const cx = lerp(NET.cx, 1390, e), cy = lerp(NET.cy, 560, e);
  const w = lerp(NET.cr * 2, 440, e), h = lerp(NET.cr * 2, 600, e), rad = lerp(NET.cr, 8, e), rot = lerp(0, -0.05, e);
  const count = Math.max(1, Math.round(1 + 99 * Ease.outCubic(prog(t, 18.1, 2.2))));
  const layers = Math.floor(1 + (count / 100) * 13);
  const contentA = Ease.outCubic(prog(t, 15.6, 0.5));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  // 紙の束
  if (e >= 1) {
    for (let i = layers; i >= 1; i--) {
      ctx.fillStyle = i % 2 ? '#E6E8EF' : '#F6F7FA';
      ctx.fillRect(-w / 2 + i * 3.2, -h / 2 + i * 4.2, w, h);
    }
  }
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,30,0.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 26;
  ctx.beginPath(); rrPath(ctx, -w / 2, -h / 2, w, h, rad); ctx.fillStyle = C.white; ctx.fill();
  ctx.restore();
  if (e >= 1) reportPage(ctx, w, h, count, contentA);
  else {
    const la = 1 - prog(t, 15.0, 0.3);
    if (la > 0) {
      ctx.save(); ctx.globalAlpha *= la;
      ctx.font = fJP(900, 50); ctx.fillStyle = C.klein; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('自社', 0, 3);
      ctx.restore();
    }
  }
  // ページをめくる（上端を軸に、上へ跳ね上げる）
  if (t > 18.1 && t < 20.35) {
    const u = ((t - 18.1) / 0.19) % 1;
    const th = u * Math.PI * 0.5;
    const c = Math.cos(th);
    ctx.save();
    ctx.translate(0, -h / 2);
    ctx.scale(1, c);
    ctx.translate(0, h / 2);
    reportPage(ctx, w, h, Math.max(1, count - 1), 1);
    ctx.fillStyle = `rgba(0,0,40,${0.22 * Math.sin(th)})`;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }
  // ページ数のバッジ
  const bk = Ease.outBack(prog(t, 18.1, 0.5));
  if (bk > 0) {
    ctx.save();
    ctx.translate(w / 2 - 18, -h / 2 + 22);
    ctx.rotate(0.12);
    ctx.scale(bk, bk);
    dot(ctx, 0, 0, 80, C.lemon);
    ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = fEN(800, 60); ctx.fillText(String(count), 0, 14);
    ctx.font = fJP(900, 22); ctx.fillText('ページ', 0, 46);
    ctx.restore();
  }
  ctx.restore();

  // 引用
  const qk = Ease.outBack(prog(t, 15.15, 0.6));
  if (qk > 0) {
    ctx.save();
    ctx.translate(150, 372); ctx.scale(qk, qk);
    ctx.font = fEN(800, 230); ctx.fillStyle = C.lemon; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillText('“', -12, 118);
    ctx.restore();
  }
  tline(ctx, t, '実はこの会社、', 150, 520, { font: fJP(900, 88), size: 88, t0: 15.25, color: C.white });
  tline(ctx, t, 'こんなに価値があった。', 150, 636, { font: fJP(900, 88), size: 88, t0: 15.75, color: C.white });
  tline(ctx, t, '調査レポートは、ときに100ページ。', 152, 748, { font: fJP(700, 40), size: 40, t0: 18.05, color: C.lemon, mode: 'fade' });
}

/* ---- 21.0〜27.5 夜の色：世界のアーティスト → 巨大なアート ---- */
function sceneArt(ctx, t) {
  bgFlat(ctx, C.night, C.nightLight, W * 0.62, H * 0.5);
  bug(ctx, C.white);
  const G = GLOBE;
  const ang = (t - 21) * 0.32, tilt = 0.38;
  const items = [];
  for (let i = 0; i < G.pts.length; i++) {
    const p = G.pts[i];
    const appear = Ease.outBack(prog(t, 21.2 + (i / G.pts.length) * 0.9, 0.35));
    if (appear <= 0) continue;
    if (t >= p.leave + 0.7) continue;
    const q = projGlobe(p, ang, tilt, G.cx, G.cy, G.R);
    if (t < p.leave) { items.push({ x: q.x, y: q.y, z: q.z, r: 7.5 * p.s * (0.62 + 0.38 * (q.z + 1) / 2) * appear, c: p.c, a: 0.35 + 0.65 * (q.z + 1) / 2 }); continue; }
    const s0 = projGlobe(p, (p.leave - 21) * 0.32, tilt, G.cx, G.cy, G.R);
    const k = Ease.inOutCubic(prog(t, p.leave, 0.7));
    const tx = ART.cx - ART.w / 2 + p.tx, ty = ART.cy - ART.h / 2 + p.ty;
    const mx = (s0.x + tx) / 2 + p.bend * 0.4, my = Math.min(s0.y, ty) - 180;
    const x = (1 - k) * (1 - k) * s0.x + 2 * (1 - k) * k * mx + k * k * tx;
    const y = (1 - k) * (1 - k) * s0.y + 2 * (1 - k) * k * my + k * k * ty;
    items.push({ x, y, z: 2, r: lerp(8, 6, k), c: k > 0.5 ? p.paint : p.c, a: 1 });
  }
  // 網目
  ctx.lineWidth = 1.2;
  for (const [i, j] of G.links) {
    const a = G.pts[i], b = G.pts[j];
    if (t >= Math.min(a.leave, b.leave)) continue;
    const ka = prog(t, 21.2 + (i / 200) * 0.9, 0.35), kb = prog(t, 21.2 + (j / 200) * 0.9, 0.35);
    if (ka < 1 || kb < 1) continue;
    const qa = projGlobe(a, ang, tilt, G.cx, G.cy, G.R), qb = projGlobe(b, ang, tilt, G.cx, G.cy, G.R);
    ctx.strokeStyle = rgba(C.white, 0.05 + 0.13 * ((qa.z + qb.z) / 2 + 1) / 2);
    ctx.beginPath(); ctx.moveTo(qa.x, qa.y); ctx.lineTo(qb.x, qb.y); ctx.stroke();
  }
  drawArtCanvas(ctx, t);
  items.sort((a, b) => a.z - b.z);
  const A0 = ctx.globalAlpha;
  for (const it of items) { ctx.globalAlpha = A0 * it.a; dot(ctx, it.x, it.y, it.r, it.c); }
  ctx.globalAlpha = A0;

  // 左の文字
  tline(ctx, t, '世界の提携アーティスト', 160, 396, { font: fJP(700, 44), size: 44, t0: 21.55, out: 23.5, color: rgba(C.white, 0.82) });

  ctx.stroke();
  ctx.restore();
}
function closeText(ctx, t) {
  bgFlat(ctx, C.klein, C.kleinLight);
  const sh = shake(t, 56.05, 0.5, 9);
  ctx.save();
  ctx.translate(sh.x, sh.y);
  const up = Ease.inOutCubic(prog(t, 53.0, 0.6));
  const l1 = '見える形に。', l0 = 'もともとある誇りを、';
  const f1 = fJP(900, 88);
  const wA = visW(lay(ctx, l0 + l1, f1));
  const wHead = lay(ctx, l0, f1).width;
  ctx.save();
  ctx.translate(W / 2, lerp(520, 300, up));
  ctx.scale(lerp(1, 0.72, up), lerp(1, 0.72, up));
  ctx.globalAlpha *= lerp(1, 0.78, up);
  brushUnder(ctx, t, -wA / 2 + wHead, -wA / 2 + wHead + lay(ctx, '見える形に', f1).width, 26, 51.25, C.lemon);
  tline(ctx, t, l0 + l1, 0, 0, { font: f1, size: 88, align: 'center', t0: 50.3, color: C.white });
  ctx.restore();
  tline(ctx, t, '自社の自慢できない社員を、', W / 2, 576, { font: fJP(900, 76), size: 76, align: 'center', t0: 53.3, color: C.white });
  const zk = Ease.outBack(prog(t, 55.0, 0.55));
  if (zk > 0) {
    const segW0 = measure(ctx, fJP(900, 300), '0');
    const segW1 = measure(ctx, fJP(900, 120), 'にする。');
    const total = segW0 + 22 + segW1 - 60;
    const x0 = W / 2 - total / 2;
    ctx.save();
    ctx.translate(x0 + segW0 / 2, 826 - 96);
    ctx.scale(zk, zk);
    ctx.font = fJP(900, 300); ctx.fillStyle = C.lemon; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('0', 0, 96);
    ctx.restore();
    tline(ctx, t, 'にする。', x0 + segW0 + 22, 826, { font: fJP(900, 120), size: 120, t0: 55.12, color: C.white });
  }
  if (t > 56.0) drawCrack(ctx, CRACK2, Ease.outCubic(prog(t, 56.05, 0.42)), Ease.inOutCubic(prog(t, 56.2, 0.3)));
  ctx.restore();
}
function closeLogo(ctx, t) {
  bgFlat(ctx, C.kleinDeep, C.klein, W / 2, H * 0.5);
  // ロゴとコピーの上からは、しぶきを退かせる
  const clear = { x0: 240, x1: 1690, y0: 430, y1: 830, k: Ease.inOutCubic(prog(t, 57.3, 0.7)) };
  drawBurst(ctx, BURST2, t, 56.5, 1, clear);
  ctx.save();
  ctx.translate(W / 2, 640);
  wordmark(ctx, t, 300, C.white, 56.7, 57.25);
  ctx.restore();
  tline(ctx, t, 'もともとある誇りを、見える形に。', W / 2, 784, { font: fJP(700, 50), size: 50, align: 'center', t0: 57.45, color: rgba(C.white, 0.9), mode: 'fade', stagger: 0.02 });
}
function sceneClose(ctx, t) {
  if (t < 56.5) closeText(ctx, t);
  else if (t < 57.25) drawSplit(ctx, CRACK2, prog(t, 56.5, 0.75), () => closeLogo(ctx, t), () => closeText(ctx, t));
  else closeLogo(ctx, t);
}

/* =====================================================================
   合成
   ===================================================================== */
const grainPatterns = new WeakMap();
function overlays(ctx, t) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.17)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  let pats = grainPatterns.get(ctx);
  if (!pats) { pats = GRAIN.map((c) => ctx.createPattern(c, 'repeat')); grainPatterns.set(ctx, pats); }
  // 粒子は動かさない（紙や壁の質感。動かすと MP4 の容量が数倍になる）
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = pats[0];
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function drawSubtitle(ctx, t) {
  const cue = NARRATION.find((c) => t >= c.s && t <= c.e + 0.2);
  if (!cue) return;
  const a = clamp((t - cue.s) / 0.12) * clamp((cue.e + 0.2 - t) / 0.15);
  const font = fJP(700, 30);
  const w = measure(ctx, font, cue.text);
  ctx.save();
  ctx.globalAlpha = a;
  fillRR(ctx, W / 2 - w / 2 - 22, 1024, w + 44, 46, 6, 'rgba(0,0,0,0.62)');
  ctx.font = font; ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(cue.text, W / 2, 1058);
  ctx.restore();
}

function render(ctx, t, opt = {}) {
  t = clamp(t, 0, DURATION);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (t < 10.2) sceneGray(ctx, t);
  else if (t < 11.0) drawSplit(ctx, CRACK1, prog(t, 10.2, 0.8), () => sceneKlein(ctx, t), () => sceneGray(ctx, t));
  else if (t < 21.0) sceneKlein(ctx, t);
  else if (t < 21.5) drawWipe(ctx, prog(t, 21.0, 0.5), WIPES[0], 1, () => sceneKlein(ctx, t), () => sceneArt(ctx, t));
  else if (t < 27.0) sceneArt(ctx, t);
  else if (t < 27.5) drawWipe(ctx, prog(t, 27.0, 0.5), WIPES[1], -1, () => sceneArt(ctx, t), () => sceneWorkshop(ctx, t));
  else if (t < 31.8) sceneWorkshop(ctx, t);
  else if (t < 32.3) drawWipe(ctx, prog(t, 31.8, 0.5), WIPES[2], 1, () => sceneWorkshop(ctx, t), () => sceneProof(ctx, t));
  else if (t < 49.8) sceneProof(ctx, t);
  else if (t < 50.3) drawWipe(ctx, prog(t, 49.8, 0.5), WIPES[3], -1, () => sceneProof(ctx, t), () => sceneClose(ctx, t));
  else sceneClose(ctx, t);
  overlays(ctx, t);
  if (opt.subs) drawSubtitle(ctx, t);
  ctx.restore();
}

/* =====================================================================
   フォント読み込み
   ===================================================================== */
async function loadFonts() {
  const sample = NARRATION.map((c) => c.text).join('') + '0123456789%,.crack“導入事例実績名刺Tシャツトートバッグマグカップ缶バッジ';
  const specs = ['900 64px "ZKG Local"', '700 64px "ZKG Local"', '800 64px "Syne Local"'];
  const wanted = Promise.all(specs.map((s) => document.fonts.load(s, sample).catch(() => null)));
  await Promise.race([wanted, new Promise((r) => setTimeout(r, 8000))]);
  if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2000))]);
  clearTextCaches();
}

/* =====================================================================
   書き出し用フック（render.mjs から使う）
   ===================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
window.__crack = {
  duration: DURATION,
  width: W,
  height: H,
  cues: NARRATION,
  ready: false,
  draw(t, subs) { render(ctx, t, { subs: !!subs }); },
  grab(t, subs, type = 'image/png', quality) { render(ctx, t, { subs: !!subs }); return cv.toDataURL(type, quality); },
};

if (RENDER_MODE) {
  document.body.classList.add('render');
  loadFonts().then(() => { render(ctx, 0); window.__crack.ready = true; });
  return;
}

/* =====================================================================
   プレイヤー
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const ui = {
  play: $('play'), icoPlay: $('icoPlay'), icoPause: $('icoPause'), time: $('time'), seek: $('seek'),
  subs: $('subs'), voice: $('voice'), exportBtn: $('export'), fs: $('fs'), bigPlay: $('bigPlay'),
  loading: $('loading'), status: $('status'), cues: $('cues'), stage: $('stage'),
};
const POSTER_T = 11.8;
let cur = 0, playing = false, started = false, exporting = false, lastNow = 0, dirty = true, lastCue = -1;

const fmt = (s) => {
  const m = Math.floor(s / 60), r = s - m * 60;
  return `${m}:${r.toFixed(1).padStart(4, '0')}`;
};
function buildCueList() {
  NARRATION.forEach((c, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<time>${fmt(c.s)}</time><span></span>`;
    b.querySelector('span').textContent = c.text;
    b.addEventListener('click', () => { seek(c.s - 0.3); });
    li.appendChild(b);
    ui.cues.appendChild(li);
  });
}
function updateUI() {
  ui.time.textContent = `${fmt(cur)} / 1:00`;
  if (document.activeElement !== ui.seek) ui.seek.value = cur.toFixed(2);
  ui.icoPlay.hidden = playing;
  ui.icoPause.hidden = !playing;
  ui.play.setAttribute('aria-label', playing ? '一時停止' : '再生');
  const idx = NARRATION.findIndex((c) => cur >= c.s - 0.05 && cur <= c.e + 0.3);
  if (idx !== lastCue) {
    [...ui.cues.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('on', i === idx));
    lastCue = idx;
  }
}
function speak(cue) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(cue.say || cue.text);
  u.lang = 'ja-JP';
  u.rate = 1.12;
  const v = speechSynthesis.getVoices().find((x) => /^ja/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function setPlaying(p) {
  if (p && cur >= DURATION - 0.01) cur = 0;
  playing = p;
  if (p) { started = true; ui.bigPlay.hidden = true; }
  if (!p && 'speechSynthesis' in window) speechSynthesis.cancel();
  dirty = true;
  updateUI();
}
function seek(t) {
  cur = clamp(t, 0, DURATION);
  started = true;
  ui.bigPlay.hidden = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  dirty = true;
  updateUI();
}
function loop(now) {
  if (!exporting) {
    if (playing) {
      const prev = cur;
      cur = Math.min(DURATION, cur + Math.min(0.1, (now - lastNow) / 1000));
      if (ui.voice.checked) for (const c of NARRATION) if (c.s > prev && c.s <= cur) speak(c);
      if (cur >= DURATION) setPlaying(false);
      dirty = true;
      updateUI();
    }
    if (dirty) {
      render(ctx, started ? cur : POSTER_T, { subs: started && ui.subs.checked });
      dirty = false;
    }
  }
  lastNow = now;
  requestAnimationFrame(loop);
}
async function exportWebM() {
  if (!('MediaRecorder' in window) || !cv.captureStream) {
    ui.status.textContent = 'このブラウザは動画の書き出しに対応していません。Chrome か Edge で開いてください。';
    return;
  }
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  setPlaying(false);
  exporting = true;
  ui.exportBtn.disabled = true;
  ui.play.disabled = true;
  const stream = cv.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16000000 });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise((r) => { rec.onstop = r; });
  started = true;
  ui.bigPlay.hidden = true;
  render(ctx, 0, { subs: ui.subs.checked });
  rec.start(250);
  const t0 = performance.now();
  await new Promise((resolve) => {
    const step = () => {
      const tt = (performance.now() - t0) / 1000;
      cur = Math.min(DURATION, tt);
      render(ctx, cur, { subs: ui.subs.checked });
      updateUI();
      ui.status.textContent = `書き出し中 ${Math.floor((cur / DURATION) * 100)}%　タブを表示したままお待ちください`;
      if (tt >= DURATION + 0.2) resolve(); else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  rec.stop();
  await stopped;
  const blob = new Blob(chunks, { type: 'video/webm' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'crack_service_video.webm';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  exporting = false;
  ui.exportBtn.disabled = false;
  ui.play.disabled = false;
  ui.status.textContent = 'WebMを書き出しました（無音）。';
  dirty = true;
}

ui.play.addEventListener('click', () => setPlaying(!playing));
ui.bigPlay.addEventListener('click', () => setPlaying(true));
ui.seek.addEventListener('input', () => seek(parseFloat(ui.seek.value)));
ui.subs.addEventListener('change', () => { dirty = true; });
ui.voice.addEventListener('change', () => { if (!ui.voice.checked && 'speechSynthesis' in window) speechSynthesis.cancel(); });
ui.exportBtn.addEventListener('click', exportWebM);
ui.fs.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (ui.stage.requestFullscreen) ui.stage.requestFullscreen();
});
document.addEventListener('keydown', (e) => {
  if (exporting) return;
  const tag = e.target.tagName;
  if (e.key === ' ' && tag !== 'BUTTON' && tag !== 'INPUT') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === ' ' && tag === 'INPUT' && e.target.type === 'range') { e.preventDefault(); setPlaying(!playing); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && e.target !== ui.seek) {
    e.preventDefault();
    seek(cur + (e.key === 'ArrowLeft' ? -2 : 2));
  } else if (e.key === 'f' || e.key === 'F') ui.fs.click();
  else if (e.key === 'c' || e.key === 'C') { ui.subs.checked = !ui.subs.checked; dirty = true; }
});
if ('speechSynthesis' in window) speechSynthesis.getVoices();

buildCueList();
loadFonts().then(() => {
  ui.loading.hidden = true;
  ui.bigPlay.hidden = false;
  dirty = true;
  updateUI();
  requestAnimationFrame((now) => { lastNow = now; loop(now); });
});
})();
</script>
</body>
</html>
