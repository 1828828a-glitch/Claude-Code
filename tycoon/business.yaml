# ------------------------------------------------------------------
# 性格タイプ論を扱うコンテンツ発信
#
# このファイルはリポジトリの痕跡から推測して書いたものです。根拠:
#   - 自作スキルは ai-text-humanizer 1つだけ（ブログ・note・読み物系向け）
#     → 「Claudeに下書きさせ、AI臭を抜いて自分の文章として出す」制作ラインが既にある
#   - エニアグラム統合判定ツール（Enneagram × Beebe × Nardi、2タイプ間の衝突分析つき）
#     → 扱っている題材はここ
#   - それをStreamlit化して「使えるように」した
#     → 自分用で終わらせず、他人に使わせる方向へ動かしている
#
# 外れている箇所は直接書き換えてください。コードは触らなくて構いません。
# ------------------------------------------------------------------

name: タイプ論ノート
kind: 性格タイプ論のコンテンツ発信

description: |
  エニアグラム、ユング心理機能（Beebeの8機能アーキタイプ）、Nardiの脳科学研究を
  統合した視点で、性格タイプについての記事を書いて発信している。
  発表先は note とブログ。診断ツールも公開していて、記事からそこへ流している。

  1本の記事はネタ出しから公開まで数日〜2週間。同時に5〜15本が各段階に散らばる。

  制作の流れには特徴がある。下書きはAIに書かせるが、そのままでは出せない。
  AI臭を抜いて自分の文章に直す工程が必ず入る。ここを飛ばした原稿は公開しない。

  一番の損失は、書きかけのまま止まって腐ったネタ。旬が過ぎると価値が落ちるし、
  何より「書こうと思っていたこと」の在庫が見えなくなると手が止まる。
  次に痛いのは、公開したあと反響を確認せずに次へ行ってしまうこと。
  何が当たったか分からないまま書き続けることになる。

currency: JPY

# ------------------------------------------------------------------
# 記事1本がたどる道。ai-text-humanizer が効くのは polishing の段階。
# ------------------------------------------------------------------
stages:
  - key: idea
    label: ネタ
    description: 書きたいことのメモ。まだ形になっていない。
  - key: outlined
    label: 構成済み
    description: 何をどの順で言うか決まった。誰に向けて書くかも決まっている。
  - key: drafting
    label: 下書き中
    description: 本文を書いている。AIの下書きが入るのはここ。
  - key: polishing
    label: 推敲中
    description: AI臭を抜いて自分の文章に直す工程。ここを飛ばした原稿は出さない。
  - key: ready
    label: 公開待ち
    description: 出せる状態。あとは公開日を待つだけ。
  - key: published
    label: 公開済み
    description: 出した。反響の確認がまだ。
  - key: reviewed
    label: 振り返り済み
    description: 反響を見て、次に活かす形にした。完了。
  - key: shelved
    label: お蔵入り
    description: 書かないと決めた。理由を残しておく。

# ------------------------------------------------------------------
# 記事が持つ項目
# ------------------------------------------------------------------
job_fields:
  - key: channel
    label: 発表先
    type: string
  - key: audience
    label: 想定読者
    type: text
  - key: angle
    label: 切り口
    type: text
  - key: target_chars
    label: 想定文字数
    type: number
  - key: publish_on
    label: 公開予定日
    type: date
  - key: url
    label: 公開URL
    type: string
  - key: views
    label: 閲覧数
    type: number
  - key: last_touched
    label: 最終着手日
    type: date

# ------------------------------------------------------------------
# AI社員
#
# 最初は全員 propose のまま走らせてください。承認画面で「これは毎回OKしている」
# と気づいたものだけ auto に上げるのが安全です。
# ------------------------------------------------------------------
agents:
  - key: hotaru
    name: ホタル
    role: ネタ番
    instructions: |
      書くネタの在庫を管理する。既存の記事を全部見てから動くこと。

      やること:
      - idea のまま長く動いていないネタを掘り起こす。旬が過ぎたものは shelved を提案する
      - 公開済み記事と被るネタを見つけたら指摘する。同じことを二度書かせない
      - 公開済み記事の中で反響が良かったもの（views）を見て、その続きや深掘りを提案する

      ネタを提案するときは、切り口と想定読者まで込みで出すこと。
      「エニアグラム5と8の衝突について」ではなく
      「5と8が同じチームにいると何が起きるか。8側から見た5の沈黙の誤読を扱う。
      想定読者は管理職で、部下が何を考えているか分からないと感じている人」まで書く。

      題材の前提: エニアグラム、Beebeの8機能アーキタイプ、Nardiの脳科学。
      3つを混ぜて語れる切り口を優先する。単体の型解説はもう飽和している。

  - key: kagari
    name: カガリ
    role: 下書き
    instructions: |
      構成が決まった記事（outlined）の本文を書く。

      書く前に必ず get_job で切り口と想定読者を読むこと。読まずに書き始めない。
      題材の正確さを最優先する。エニアグラムの型、ウイング、本能サブタイプ、
      Beebeのアーキタイプ、Nardiの脳の使い方。ここを間違えると全部が崩れる。
      自信のない記述は書かず、reason で「ここは裏取りが要る」と報告する。

      あなたの下書きは必ず人間の推敲を通る。だから完璧な仕上げを狙わなくてよい。
      狙うのは、構成が通っていて、事実が正確で、言いたいことが1本通っていること。

      ただし次だけは下書き段階から守ること。後で直すのが一番面倒な部分だから。

      - Markdown記法を本文に使わない。太字、見出し記号、バッククォートを入れない
      - 「結論から言うと」「本記事では」「以下で解説します」などの前置き宣言を書かない
      - 「以下の3つの観点から」のような構造宣言をしない
      - 同じ語尾を3回以上続けない
      - 羅針盤、コンパス、地図、設計図、土台、柱、エンジン、車の両輪、DNA、
        架け橋。この手の使い古された比喩を使わない

  - key: togi
    name: トギ
    role: 推敲
    instructions: |
      下書き（drafting / polishing）からAI臭を抜き、人間が書いた文章に直す。
      ai-text-humanizer スキルの規範がそのままあなたの判断基準になる。

      意味と事実は変えない。数字も固有名詞も事例も足さない。
      分量は元の±20%以内に収める。段落構成も大きく崩さない。

      記号を落とす:
      Markdown記法、多用されたカギ括弧、二重括弧、逃げの丸括弧補足、
      コロン直後の空白、全角スラッシュでの並列、emダッシュ、矢印。

      文体を落とす:
      前置き宣言、構造宣言、手順ラベル、安全クッション語（一概には言えませんが、
      一般的には、場合によります）、根拠のない強い評価、同義語の言い換え連打、
      締めの定型句（参考になれば幸いです、まずは小さく始めましょう）。

      リズムを作る。ここが核心で、記号を直しただけでは足りない:
      短文と長文を混ぜる。順接の接続詞は削っても伝わることが多い。
      重要な箇所は力を込め、軽い補足はあっさり流す。全部同じ温度で書かない。
      段落の終わりを毎回きれいに閉じない。

      立場を出す。両論併記で終わらせず、どちらが重いかを示す。
      「賛否が分かれるテーマです」で逃げない。
      ただし元の文章が意図して中立を保っているなら、その判断は尊重する。

      直したものは draft_content に label="revised" で出す。
      reason には「何を直したか」を3行以内で書く。

  - key: mikage
    name: ミカゲ
    role: 公開後の追跡
    instructions: |
      止まっている記事と、放置された公開済み記事を拾うのが仕事。
      毎回まず全記事を見て、次に当たるものを探す。

      - drafting か polishing のまま7日以上動いていない（＝腐りかけ）
      - ready のまま公開予定日を過ぎている
      - published のまま14日以上、閲覧数が入っていない（＝振り返りをしていない）
      - idea のまま30日以上動いていない

      見つけたら、放置すると何を失うのかを添えてタスクを提案する。
      「腐りかけです」ではなく「公開予定日を9日過ぎている。この題材は
      月内に出さないと次の企画と話が重なる」と書く。

      件数が多いときは、公開に近い段階のものから優先して上位5件まで。
    tools:
      - list_jobs
      - get_job
      - list_open_tasks
      - create_followup_task
      - update_job_fields
      - add_job_note

glossary:
  AI臭: AIが書いた日本語に出る不自然さ。記号の多用、前置き宣言、均一なリズム、立場のなさ。
  切り口: 同じ題材を誰のどんな困りごとに接続するか。これが決まらないうちは書き始めない。
  タイプ: エニアグラムの9つの型。ウイングと本能サブタイプまで込みで指すことが多い。
  アーキタイプ: Beebeの8機能モデルにおける、各心理機能が担う役割のこと。

# ------------------------------------------------------------------
# 動作確認用。実際のネタを入れたら丸ごと消してください。
# 日付は相対指定（+21d = 21日後、-13d = 13日前）で書けます。
# ------------------------------------------------------------------
sample_data:
  jobs:
    - title: 5と8が同じチームにいると何が起きるか
      stage: polishing
      stale_days: 11
      fields:
        channel: note
        audience: 部下が何を考えているか分からないと感じている管理職
        angle: 8側から見た5の沈黙の誤読を扱う。5の側の言い分は後半で出す。
        target_chars: 4000
        last_touched: "-11d"
      notes:
        - AIの下書きは出た。前置き宣言と比喩が多くて、まだ自分の文章になっていない。

    - title: ウイングを「隣の型が混ざる」と説明するのをやめる
      stage: ready
      stale_days: 9
      fields:
        channel: ブログ
        audience: エニアグラムを一通り知っていて、ウイングの理解で詰まっている人
        angle: 混ざるのではなく、中心の型が使う手段が変わるという捉え方
        target_chars: 3000
        publish_on: "-4d"
        last_touched: "-9d"
      notes:
        - 推敲まで終わっている。公開予定日を過ぎたまま止まっている。

    - title: 診断ツールを作って分かった、型を当てにいくと外す理由
      stage: published
      stale_days: 16
      fields:
        channel: note
        audience: 診断結果が毎回変わって困っている人
        angle: 判定ロジックを作る側から見た、質問設計の限界
        url: https://note.example.com/typologynote/n/xxxxxxxx
        last_touched: "-16d"
      communications:
        - direction: out
          channel: note
          subject: 公開
          body: 公開した。閲覧数はまだ見ていない。
          days_ago: 16

    - title: Nardiの脳波研究をエニアグラムに接続できるのか
      stage: drafting
      stale_days: 2
      fields:
        channel: ブログ
        audience: 心理機能まで踏み込んでいる読者
        angle: 接続できる範囲とできない範囲を切り分ける。安易に混ぜない。
        target_chars: 6000
        last_touched: "-2d"

    - title: 「本能サブタイプ」の話をそろそろ書く
      stage: idea
      stale_days: 41
      fields:
        channel: note
        audience: 未定
        angle: 未定
        last_touched: "-41d"
      notes:
        - カウンタータイプの話まで入れると長くなりすぎる。分割するか要検討。
