# ------------------------------------------------------------------
# 事業定義。このファイル1枚を書き換えれば別の業種に載せ替わる。
#
#   cp tycoon/business.example.yaml tycoon/business.yaml
#
# してから、下の TODO を自分の仕事に合わせて埋めてください。
# コードは一切触らなくて構いません。
# ------------------------------------------------------------------

# TODO: あなたの屋号 / 会社名
name: サンプル工房

# TODO: 何をやっている事業か。一言で。
kind: 案件型の受託業

# TODO: AI社員が状況を理解するための説明。
# ここが薄いと提案の質が落ちます。実際に新人に説明するつもりで書いてください。
# 「うちは何で稼いでいて」「何が起きたら喜ぶ / 困るのか」まで書くと効きます。
description: |
  問い合わせを受けて見積を出し、合意したら制作・納品して請求する。
  1案件あたりの期間は2週間〜2か月。同時に10〜20件が動く。

  取りこぼしが一番の損失。見積を出したまま追いかけていない案件と、
  納品したのに請求を出していない案件、この2つが売上を静かに削る。

currency: JPY

# ------------------------------------------------------------------
# パイプライン。案件はこの順に進む。
# TODO: 自分の仕事の実際の流れに書き換える。段階の数は5〜9くらいが扱いやすい。
# ------------------------------------------------------------------
stages:
  - key: lead
    label: 問い合わせ
    description: 連絡が来ただけ。まだ何も見ていない。
  - key: qualified
    label: 内容確認済み
    description: やる価値と実現性を確認した。見積を作れる状態。
  - key: estimate_sent
    label: 見積提出済み
    description: 金額を出して返事待ち。ここに滞留した案件が一番危ない。
  - key: won
    label: 受注
    description: 合意した。着手できる。
  - key: in_progress
    label: 進行中
    description: 実作業中。
  - key: delivered
    label: 納品済み
    description: 納めた。請求がまだ。
  - key: paid
    label: 入金済み
    description: 完了。
  - key: lost
    label: 失注
    description: 断られた、または連絡が途絶えた。

# ------------------------------------------------------------------
# 案件が持つ項目。
# TODO: 自分が実際に台帳で管理している列に書き換える。
# type は string / number / date / text のいずれか。
# ------------------------------------------------------------------
job_fields:
  - key: amount
    label: 金額
    type: number
  - key: due_date
    label: 希望納期
    type: date
  - key: source
    label: 流入経路
    type: string
  - key: scope
    label: 作業範囲
    type: text
  - key: last_contact
    label: 最終接触日
    type: date

# ------------------------------------------------------------------
# AI社員。
#
# autonomy:
#   propose — 提案を作るだけ。人間が承認するまで実行されない（既定）
#   auto    — 承認なしで即実行。監査ログには残る
#
# 最初は全部 propose のままで走らせて、承認画面で「これは毎回OKしている」
# と気づいたものだけ auto に昇格させるのが安全です。
# ------------------------------------------------------------------
agents:
  - key: riley
    name: リリー
    role: 顧客対応
    instructions: |
      顧客への連絡を担当する。優先順位は、返事が止まっている案件 >
      納期が近い案件 > その他。

      文面の方針:
      - 日本語。相手が事業者なら敬体、個人客なら少しやわらかく。
      - 1通に用件は1つ。相手が次に何をすればいいかを最後の1文で明示する。
      - こちらの都合（社内事情、忙しさ）は書かない。
      - 金額や日付を書くときは必ず案件データで裏を取る。記憶で書かない。

      同じ相手に24時間以内の連絡が既にある場合は、追撃しない。

  - key: devi
    name: デヴィ
    role: 台帳整備
    instructions: |
      案件データの整合性を保つ。実際に起きた出来事と台帳がずれている箇所を見つけ、
      直す提案を出す。

      よくあるずれ:
      - 顧客から返事が来ているのに段階が動いていない
      - 見積を送ったのに金額が入っていない
      - 納品の連絡をしたのに delivered になっていない

      推測で段階を進めない。やり取りの履歴に根拠がある場合だけ提案する。
    autonomy:
      add_job_note: auto

  - key: wilem
    name: ウィレム
    role: 取りこぼし監視
    instructions: |
      放置されている案件を洗い出すのが仕事。毎回まず全案件を見て、
      次の条件に当たるものを拾う:

      - estimate_sent のまま7日以上動いていない
      - delivered のまま14日以上動いていない（＝請求漏れの疑い）
      - 希望納期まで7日を切っているのに in_progress ですらない

      見つけたら、放置するといくら / いつ損をするのかを添えて
      フォローアップのタスクを提案する。件数が多い場合は影響額の大きい順に上位5件まで。
    tools:
      - list_jobs
      - get_job
      - list_open_tasks
      - create_followup_task
      - add_job_note

# ------------------------------------------------------------------
# 用語。社内語や略語があるとAI社員の精度が上がる。
# TODO: 自分の現場の言葉に書き換える。
# ------------------------------------------------------------------
glossary:
  取りこぼし: 対応可能だったのに連絡が途絶えて失注した案件のこと。
  滞留: ある段階に想定より長く留まっている状態。

# ------------------------------------------------------------------
# `python -m tycoon seed` で入るサンプル。実データを入れたら丸ごと消す。
# 日付は相対指定（+21d = 21日後、-13d = 13日前）が使えます。
# わざと「放置された案件」を混ぜてあります。AI社員が拾えるか試すため。
# ------------------------------------------------------------------
sample_data:
  customers:
    - key: tanaka
      name: 田中製作所
      fields:
        email: tanaka@example.co.jp
        type: 法人
    - key: hirano
      name: 平野 さくら
      fields:
        email: hirano@example.com
        type: 個人
    - key: lopez
      name: 株式会社ロペス商会
      fields:
        email: info@lopez.example.jp
        type: 法人

  jobs:
    # 見積を出して13日放置。取りこぼし予備軍。
    - title: 田中製作所 — 設備更新の設計
      stage: estimate_sent
      customer: tanaka
      stale_days: 13
      fields:
        amount: 1870000
        due_date: "+21d"
        source: 紹介
        scope: 既存設備の実測、図面作成、施工業者への引き継ぎまで
        last_contact: "-13d"
      communications:
        - direction: out
          channel: email
          subject: お見積のご送付
          body: お世話になっております。ご依頼いただいた件のお見積を添付いたします。
          days_ago: 13

    # 納品済みだが請求していない。静かに売上が消えるタイプ。
    - title: 平野様 — 内装リニューアル
      stage: delivered
      customer: hirano
      stale_days: 19
      fields:
        amount: 623000
        due_date: "-20d"
        source: Web問い合わせ
        scope: 1階フロアの内装一式
        last_contact: "-19d"
      notes:
        - 現地で最終確認、先方OK。請求はまた今度。

    # 納期が迫っているのに着手前。
    - title: ロペス商会 — 什器製作
      stage: won
      customer: lopez
      fields:
        amount: 2400000
        due_date: "+5d"
        source: 展示会
        scope: 店舗什器 12点の製作と搬入
        last_contact: "-4d"

    # 正常に動いている案件。ノイズとして混ぜる。
    - title: 田中製作所 — 定期メンテナンス
      stage: in_progress
      customer: tanaka
      fields:
        amount: 180000
        due_date: "+10d"
        source: 既存顧客
        scope: 四半期点検
        last_contact: "-1d"

    - title: 問い合わせ — 事務所移転の相談
      stage: lead
      fields:
        source: Web問い合わせ
        scope: 未確認
        last_contact: "-2d"
