<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秋植え野菜20選</title>
<style>
  @font-face { font-family: "Dela Gothic One"; src: url(fonts/DelaGothicOne.ttf); font-weight: 400; }
  @font-face { font-family: "Noto Sans JP"; src: url(fonts/NotoSansJP-500.ttf); font-weight: 500; }
  @font-face { font-family: "Noto Sans JP"; src: url(fonts/NotoSansJP-700.ttf); font-weight: 700; }
  @font-face { font-family: "Noto Sans JP"; src: url(fonts/NotoSansJP-900.ttf); font-weight: 900; }
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; max-width: calc(100vh * 16 / 9); aspect-ratio: 16 / 9; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script id="main">
// 1920x1080 / 30fps 想定。render(t) は t 秒時点の絵を決定論的に描く。
const W = 1920, H = 1080, FPS = 30, DURATION = 57;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  cream: '#F6ECDC', ink: '#1C1915', orange: '#E8622C', mustard: '#EBAA2C',
  green: '#2F5D3A', leaf: '#6DB33F', red: '#D8432B', sky: '#4C7FA8', ice: '#8EC3E0',
};
const DISP = '"Dela Gothic One"', SANS = '"Noto Sans JP"';

// ---------- easing / utils ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutExpo = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eInExpo = x => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const eOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);

function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function setFont(size, fam = SANS, w = 900) { ctx.font = `${fam === DISP ? 400 : w} ${size}px ${fam}`; }

function text(s, x, y, { size = 40, fam = SANS, w = 900, color = C.ink, align = 'left', alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  setFont(size, fam, w);
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
  ctx.restore();
}

// マスクの下から文字がせり上がる
function reveal(s, x, y, { size = 100, fam = DISP, w = 900, color = C.ink, align = 'left' } = {}, p) {
  if (p <= 0) return;
  p = eOutExpo(p);
  ctx.save();
  setFont(size, fam, w);
  const mw = ctx.measureText(s).width;
  const left = align === 'center' ? x - mw / 2 : align === 'right' ? x - mw : x;
  ctx.beginPath(); ctx.rect(left - 30, y - size * 1.1, mw + 60, size * 1.42); ctx.clip();
  ctx.fillStyle = color; ctx.textAlign = align;
  ctx.fillText(s, x, y + (1 - p) * size * 1.4);
  ctx.restore();
}

function pill(s, x, y, { size = 30, bg = C.orange, color = C.cream, p = 1 } = {}) {
  if (p <= 0) return 0;
  ctx.save();
  setFont(size, SANS, 900);
  const w = ctx.measureText(s).width + size * 1.2, h = size * 1.7;
  const sc = eOutBack(p);
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(sc, sc);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s, 0, size * 0.06);
  ctx.restore();
  return w;
}

function wrap(s, maxW) {
  const lines = []; let cur = '';
  for (const ch of s) {
    if (ctx.measureText(cur + ch).width > maxW && cur) {
      // 句読点を行頭に送らない
      if ('、。）」'.includes(ch)) { cur += ch; continue; }
      lines.push(cur); cur = ch;
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---------- shapes ----------
function leafPath(len, wid) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(wid, -len * 0.25, wid * 0.8, -len * 0.8, 0, -len);
  ctx.bezierCurveTo(-wid * 0.8, -len * 0.8, -wid, -len * 0.25, 0, 0);
}
function drawLeaf(x, y, len, wid, rot, color, vein = true) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  leafPath(len, wid); ctx.fillStyle = color; ctx.fill();
  if (vein) {
    ctx.strokeStyle = shade(color.startsWith('#') ? color : '#6DB33F', -0.3); ctx.lineWidth = Math.max(2, len * 0.02);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len * 0.85); ctx.stroke();
  }
  ctx.restore();
}

function drawSnow(x, y, r, rot, color, lw = 4) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    ctx.rotate(Math.PI / 3);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -r);
    ctx.moveTo(0, -r * 0.55); ctx.lineTo(r * 0.25, -r * 0.8);
    ctx.moveTo(0, -r * 0.55); ctx.lineTo(-r * 0.25, -r * 0.8);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBug(x, y, s, ang, wig) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    const k = Math.sin(wig + i) * 4;
    ctx.beginPath(); ctx.moveTo(-10, i * 10); ctx.lineTo(-26, i * 14 + k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, i * 10); ctx.lineTo(26, i * 14 - k); ctx.stroke();
  }
  ctx.fillStyle = '#3A2E2A';
  ctx.beginPath(); ctx.ellipse(0, 4, 15, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -20, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.red; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 22); ctx.stroke();
  ctx.restore();
}

// ---------- vegetable icons (原点中心・半径およそ200) ----------
const GREEN = '#5DAA3C';
function leafFan(n, len, wid, spread, color, baseY) {
  for (let i = 0; i < n; i++) {
    const a = (i - (n - 1) / 2) * spread;
    const l = len * (1 - Math.abs(i - (n - 1) / 2) / n * 0.5);
    drawLeaf(0, baseY, l, wid, a, i % 2 ? shade(color, -0.12) : color);
  }
}
function drawIcon(type, col) {
  ctx.save();
  ctx.lineJoin = 'round';
  switch (type) {
    case 'daikon': {
      leafFan(5, 170, 50, 0.35, GREEN, -50);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(-70, -60); ctx.bezierCurveTo(-75, 60, -30, 180, 0, 230);
      ctx.bezierCurveTo(30, 180, 75, 60, 70, -60); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#C9E3A4';
      ctx.beginPath(); ctx.moveTo(-70, -60); ctx.lineTo(70, -60); ctx.lineTo(72, -10); ctx.lineTo(-72, -10); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 4;
      for (const yy of [40, 100, 150]) { ctx.beginPath(); ctx.moveTo(-30, yy); ctx.lineTo(-10, yy + 4); ctx.stroke(); }
      break;
    }
    case 'kabu': {
      leafFan(5, 160, 48, 0.4, GREEN, -40);
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 70, 125, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#B07CC6'; ctx.beginPath(); ctx.arc(0, 70, 125, Math.PI * 1.1, Math.PI * 1.9); ctx.lineTo(0, 0); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 190); ctx.quadraticCurveTo(10, 220, 0, 245); ctx.stroke();
      break;
    }
    case 'potato': {
      ctx.rotate(-0.3);
      ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, 190, 135, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = shade(col, -0.25);
      for (const [x, y] of [[-90, -40], [20, 50], [100, -30], [-30, -80], [-110, 50], [60, 90]]) { ctx.beginPath(); ctx.ellipse(x, y, 11, 7, 0.5, 0, Math.PI * 2); ctx.fill(); }
      break;
    }
    case 'onion': {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, -170); ctx.bezierCurveTo(60, -80, 170, -20, 160, 70);
      ctx.bezierCurveTo(150, 170, -150, 170, -160, 70); ctx.bezierCurveTo(-170, -20, -60, -80, 0, -170); ctx.fill();
      ctx.strokeStyle = shade(col, -0.25); ctx.lineWidth = 5;
      for (const k of [-0.55, 0, 0.55]) { ctx.beginPath(); ctx.moveTo(0, -160); ctx.quadraticCurveTo(160 * k, 0, 100 * k, 150); ctx.stroke(); }
      ctx.strokeStyle = '#8A6A3A'; ctx.lineWidth = 4;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 12, 148); ctx.lineTo(i * 18, 185); ctx.stroke(); }
      break;
    }
    case 'garlic': {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, -175); ctx.bezierCurveTo(40, -90, 175, -40, 165, 60);
      ctx.bezierCurveTo(155, 165, -155, 165, -165, 60); ctx.bezierCurveTo(-175, -40, -40, -90, 0, -175); ctx.fill();
      ctx.strokeStyle = shade(col, -0.2); ctx.lineWidth = 5;
      for (const k of [-0.75, -0.3, 0.3, 0.75]) { ctx.beginPath(); ctx.moveTo(0, -150); ctx.quadraticCurveTo(200 * k, -10, 120 * k, 145); ctx.stroke(); }
      ctx.fillStyle = '#E2CFA8'; ctx.beginPath(); ctx.ellipse(0, 150, 70, 14, 0, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'cabbage': {
      ctx.fillStyle = shade(col, -0.2);
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; ctx.beginPath(); ctx.arc(Math.cos(a) * 80, Math.sin(a) * 80, 120, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, 150, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = shade(col, -0.25); ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(-30, 10, 110, -1.2, 1.4); ctx.stroke();
      ctx.beginPath(); ctx.arc(30, -10, 80, 1.8, 4.4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 140); ctx.lineTo(10, -60); ctx.stroke();
      break;
    }
    case 'hakusai': {
      ctx.fillStyle = '#F4F1E4';
      ctx.beginPath(); ctx.ellipse(0, 40, 115, 190, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col;
      for (const [x, y, r] of [[-60, -110, 75], [55, -120, 80], [0, -160, 70], [-90, -30, 60], [90, -40, 62]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = '#D6D0B8'; ctx.lineWidth = 6;
      for (const x of [-45, 0, 45]) { ctx.beginPath(); ctx.moveTo(x * 0.6, 220); ctx.lineTo(x, 0); ctx.stroke(); }
      break;
    }
    case 'broccoli': {
      ctx.fillStyle = '#9CC56B';
      ctx.beginPath(); ctx.moveTo(-45, 20); ctx.lineTo(45, 20); ctx.lineTo(35, 220); ctx.lineTo(-35, 220); ctx.closePath(); ctx.fill();
      const fl = [[-110, -30, 75], [110, -30, 75], [0, -90, 95], [-70, -120, 70], [70, -120, 70], [0, 0, 80], [-130, -100, 50], [130, -100, 50]];
      for (const [x, y, r] of fl) { ctx.fillStyle = shade(col, -0.15); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
      for (const [x, y, r] of fl) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x - r * 0.15, y - r * 0.15, r * 0.7, 0, Math.PI * 2); ctx.fill(); }
      break;
    }
    case 'pod': case 'fava': {
      const fava = type === 'fava';
      ctx.rotate(-0.5);
      ctx.fillStyle = shade(col, -0.1);
      ctx.beginPath(); ctx.moveTo(-210, 0); ctx.bezierCurveTo(-120, fava ? -150 : -110, 120, fava ? -150 : -110, 210, 0);
      ctx.bezierCurveTo(120, fava ? 120 : 70, -120, fava ? 120 : 70, -210, 0); ctx.fill();
      ctx.fillStyle = fava ? '#C8E39A' : col;
      const n = fava ? 3 : 5, r = fava ? 52 : 34;
      for (let i = 0; i < n; i++) { const x = (i - (n - 1) / 2) * (fava ? 115 : 72); ctx.beginPath(); ctx.ellipse(x, -18, r * (fava ? 1.15 : 1), r, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = shade(col, -0.35); ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-210, 0); ctx.bezierCurveTo(-120, fava ? 120 : 70, 120, fava ? 120 : 70, 210, 0); ctx.stroke();
      ctx.strokeStyle = GREEN; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-210, 0); ctx.quadraticCurveTo(-250, -20, -245, -60); ctx.stroke();
      break;
    }
    case 'grass': {
      ctx.strokeStyle = col; ctx.lineCap = 'round';
      for (let i = 0; i < 9; i++) {
        const k = (i - 4) / 4;
        ctx.lineWidth = 22; ctx.strokeStyle = i % 2 ? shade(col, -0.15) : col;
        ctx.beginPath(); ctx.moveTo(k * 30, 210); ctx.quadraticCurveTo(k * 60, 0, k * 170, -200 + Math.abs(k) * 70); ctx.stroke();
      }
      ctx.fillStyle = '#F2EBD8'; ctx.beginPath(); ctx.ellipse(0, 210, 60, 26, 0, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'rosette': {
      for (let ring = 0; ring < 2; ring++) {
        const n = ring ? 7 : 10;
        for (let i = 0; i < n; i++) {
          const a = i / n * Math.PI * 2 + ring * 0.3;
          drawLeaf(0, 0, ring ? 120 : 200, ring ? 60 : 80, a, ring ? shade(col, 0.15) : col);
        }
      }
      break;
    }
    case 'ice': {
      leafFan(5, 210, 70, 0.42, col, 180);
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      const r = rng(7);
      for (let i = 0; i < 26; i++) { const a = -Math.PI / 2 + (r() - 0.5) * 2.2, d = 60 + r() * 140; ctx.beginPath(); ctx.arc(Math.cos(a) * d, 180 + Math.sin(a) * d * 1.1, 4 + r() * 6, 0, Math.PI * 2); ctx.fill(); }
      break;
    }
    case 'narrow': {
      leafFan(9, 250, 26, 0.2, col, 190);
      break;
    }
    default: { // 葉物
      const n = parseInt(type.replace('leaf', ''), 10) || 5;
      leafFan(n, 260, n > 6 ? 55 : 80, 1.4 / n, col, 190);
    }
  }
  ctx.restore();
}

// ---------- data ----------
// 月は 7=7月 ... 13=翌1月 ... 19=翌7月頭。上旬+0, 中旬+.33, 下旬+.67
const VEG = [
  { n: 'ダイコン', c: '#F4F1EA', ic: 'daikon', m: '種から', pt: '深く耕して、間引きをしっかり', sow: [[8.67, 9.67]], hv: [[10.67, 13]] },
  { n: 'ハクサイ', c: '#A8D47C', ic: 'hakusai', m: '種・苗', pt: '防虫ネットは必須', sow: [[8.67, 9.33]], pl: [[9.33, 10.67]], hv: [[10.67, 14]] },
  { n: 'ホウレンソウ', c: '#3F9A47', ic: 'leaf5', m: '種から', pt: '土の酸度調整と間引きがカギ', sow: [[9.33, 11.67]], hv: [[10, 14]] },
  { n: 'シュンギク', c: '#5DAA3C', ic: 'leaf7', m: '種から', pt: '摘心すれば何度も収穫できる', sow: [[9, 10.33]], hv: [[10, 14]] },
  { n: 'ルッコラ', c: '#86C25A', ic: 'leaf4', m: '種から', pt: '30〜40日で収穫。半日陰でもOK', sow: [[9, 11]], hv: [[10, 13]] },
  { n: 'キャベツ', c: '#A9D47C', ic: 'cabbage', m: '種・苗', pt: '秋まき春どり。とう立ちに注意', sow: [[9.33, 9.67]], pl: [[10.67, 11]], hv: [[16.33, 17.67]] },
  { n: 'ブロッコリー', c: '#3B8A3E', ic: 'broccoli', m: '種・苗', pt: 'わき芽の花蕾も収穫できる', sow: [[7, 8.67]], pl: [[8.67, 9.67]], hv: [[10.67, 15]] },
  { n: 'スナップエンドウ', c: '#8CC63F', ic: 'pod', m: '種から', pt: '冬越しが必要。連作は避ける', sow: [[10.33, 11.33]], pl: [[11.33, 12]], hv: [[16.33, 18.33]] },
  { n: 'ニラ', c: '#4F9A3A', ic: 'grass', m: '種から', pt: '多年草。収穫後に追肥すれば何度も', sow: [[9.33, 10.33]], hv: [[15, 19]] },
  { n: 'ワケギ', c: '#6CBF4E', ic: 'grass', m: '球根から', pt: '株元5cmを残して切れば再生する', pl: [[8.67, 10.33]], hv: [[11.67, 13], [15, 17]] },
  { n: 'カブ', c: '#F2EEF6', ic: 'kabu', m: '種から', pt: '直根性なので直まき＋間引き', sow: [[9, 10.33]], hv: [[10, 13]] },
  { n: 'リーフレタス', c: '#9ACD32', ic: 'leaf6', m: '種・苗', pt: '浅植えにして外葉から摘み取る', sow: [[9, 10.33]], pl: [[10.33, 11]], hv: [[10, 13]] },
  { n: 'ミズナ', c: '#B5D96B', ic: 'narrow', m: '種から', pt: '水切れに注意。寒冷紗で防寒', sow: [[9, 10.67]], hv: [[10, 13]] },
  { n: 'タアサイ', c: '#2E7D32', ic: 'rosette', m: '種から', pt: '寒さに当たるほど甘みが増す', sow: [[9, 11]], hv: [[10.33, 14.33]] },
  { n: 'アイスプラント', c: '#8FD3BE', ic: 'ice', m: '種・苗', pt: '塩水を与えると風味アップ', sow: [[9, 10.33]], pl: [[10, 11]], hv: [[11, 16]] },
  { n: 'エンドウマメ', c: '#7CB342', ic: 'pod', m: '種から', pt: '冬越しが必要。連作は避ける', sow: [[10, 11.67]], hv: [[16.33, 18.33]] },
  { n: 'ソラマメ', c: '#9CCC65', ic: 'fava', m: '種から', pt: '冬場の過湿に注意', sow: [[10.33, 11.33]], pl: [[11.33, 12]], hv: [[17.33, 18.67]] },
  { n: 'ニンニク', c: '#F3E9D2', ic: 'garlic', m: '種球から', pt: '葉ニンニクや芽も途中で楽しめる', pl: [[9, 11]], hv: [[17.33, 19]] },
  { n: 'ジャガイモ', c: '#C8A165', ic: 'potato', m: '種イモから', pt: '芽出ししてから植え、晴れの日に収穫', pl: [[8, 10]], hv: [[11, 13]] },
  { n: 'タマネギ', c: '#D9A05B', ic: 'onion', m: '種・苗', pt: '肥料のタイミングでとう立ちを防ぐ', pl: [[10, 12]], hv: [[16, 18]] },
];
const BEGIN = new Set(['ダイコン', 'ホウレンソウ', 'シュンギク', 'リーフレタス', 'ミズナ', 'カブ']);
const PLANTER = new Set(['ルッコラ', 'ホウレンソウ', 'リーフレタス', 'シュンギク', 'ニラ', 'ワケギ']);

// ---------- background bits ----------
const LEAVES = (() => {
  const r = rng(42), cols = [C.cream, C.mustard, C.red, '#B5532A'];
  return Array.from({ length: 34 }, () => ({ x: r() * W, y: r() * (H + 300), sp: 60 + r() * 120, sw: 30 + r() * 60, f: 0.5 + r(), rs: (r() - 0.5) * 2, s: 30 + r() * 50, c: cols[Math.floor(r() * cols.length)], ph: r() * 10 }));
})();
function fallingLeaves(t, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  for (const l of LEAVES) {
    const y = ((l.y + t * l.sp) % (H + 300)) - 150;
    const x = l.x + Math.sin(t * l.f + l.ph) * l.sw;
    drawLeaf(x, y, l.s, l.s * 0.35, t * l.rs + l.ph, l.c, false);
  }
  ctx.restore();
}

function rings(cx, cy, t, color, alpha = 0.35, gap = 170, speed = 160) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3;
  for (let i = 0; i < 12; i++) {
    const r = ((t * speed) % gap) + i * gap;
    ctx.globalAlpha = alpha * clamp(1 - r / 1500);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function marquee(s, y, t, speed, size, color, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; setFont(size, DISP);
  const w = ctx.measureText(s).width;
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  let x = -((t * speed) % w);
  for (; x < W; x += w) ctx.strokeText(s, x, y);
  ctx.restore();
}

function thermo(u) {
  const e = eInOut(P(u, 0.6, 2.6));
  const f = lerp(0.88, 0.1, e);
  const x = 1300, top = 220, bot = 800;
  text('気温', x, 180, { size: 52, fam: DISP, align: 'center' });
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.ink; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.roundRect(x - 42, top, 84, bot - top + 40, 42); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, 880, 78, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const mTop = bot - f * (bot - top - 30);
  const col = e > 0.5 ? C.sky : C.red;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(x - 22, mTop, 44, 880 - mTop, 22); ctx.fill();
  ctx.beginPath(); ctx.arc(x, 880, 56, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
  for (let i = 0; i < 9; i++) { const y = top + 40 + i * 62; ctx.beginPath(); ctx.moveTo(x + 42, y); ctx.lineTo(x + 62, y); ctx.stroke(); }
  text(Math.round(lerp(22, 3, e)) + '℃', x + 80, mTop + 22, { size: 64, fam: DISP, color: col });

  // 甘さメーター
  const g = lerp(0.12, 0.95, e);
  const bx = 1600, bw = 150;
  text('甘さ', bx + bw / 2, 180, { size: 52, fam: DISP, align: 'center' });
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.ink; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.roundRect(bx, top, bw, 740, 24); ctx.fill(); ctx.stroke();
  const fh = (740 - 16) * g;
  ctx.save(); ctx.beginPath(); ctx.roundRect(bx + 8, top + 8, bw - 16, 740 - 16, 18); ctx.clip();
  ctx.fillStyle = C.mustard; ctx.fillRect(bx, top + 740 - 8 - fh, bw, fh + 10);
  // 砂糖のつぶ
  const r = rng(3);
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (let i = 0; i < 40; i++) {
    const yy = top + 740 - r() * fh, xx = bx + 15 + r() * (bw - 30);
    ctx.save(); ctx.translate(xx, yy); ctx.rotate(r() * 3); ctx.fillRect(-6, -6, 12, 12); ctx.restore();
  }
  ctx.restore();
  // 上向き矢印
  const ap = P(u, 1.2, 1.6);
  if (ap > 0) {
    ctx.save(); ctx.globalAlpha = ap; ctx.fillStyle = C.orange;
    const ay = top + 740 - fh - 40 - Math.sin(u * 8) * 8;
    ctx.beginPath(); ctx.moveTo(bx + bw / 2, ay - 60); ctx.lineTo(bx + bw / 2 + 50, ay); ctx.lineTo(bx + bw / 2 - 50, ay); ctx.fill();
    ctx.restore();
  }
  // 雪
  const r2 = rng(11);
  for (let i = 0; i < 14; i++) {
    const sx = 1120 + r2() * 760, sp = 60 + r2() * 80, s0 = r2() * 900;
    const sy = ((s0 + u * sp) % 760) + 240;
    drawSnow(sx, sy, 14 + r2() * 16, u + i, C.sky, 3);
  }
}

function s3Veg(lt, t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);

  const T0 = 0.3, D = 1.22;
  const idx = clamp(Math.floor((lt - T0) / D), 0, 19);
  const u = lt - T0 - idx * D;
  const v = VEG[idx];
  const pIn = eOutExpo(P(u, 0, 0.42));
  const pOut = idx < 19 ? eInExpo(P(u, D - 0.2, D)) : 0;
  const vis = pIn * (1 - pOut);

  // フラッシュする斜めの帯
  const sp = P(u, 0, 0.42);
  if (sp > 0 && sp < 1) {
    const x = lerp(-900, W + 400, eInOut(sp));
    ctx.save(); ctx.fillStyle = v.c; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 380, 0); ctx.lineTo(x + 80, H); ctx.lineTo(x - 300, H); ctx.fill();
    ctx.restore();
  }

  text('20選', 470, 128, { size: 44, fam: DISP, color: C.mustard });
  const segW = (800 - 19 * 8) / 20;

    const x = 1000 + i * (segW + 8);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(x, 106, segW, 12);
    const f = i < idx ? 1 : i === idx ? pIn : 0;
    ctx.fillStyle = C.orange; ctx.fillRect(x, 106, segW * f, 12);

  // 背景の大きな番号

  ctx.strokeStyle = C.cream; ctx.lineWidth = 5; ctx.textAlign = 'center';

  ctx.beginPath(); ctx.arc(0, 0, 290 * (0.7 + 0.3 * pIn), 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha = vis; ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.beginPath(); ctx.arc(cx, cy, 255, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  const sc = eOutBack(P(u, 0.04, 0.45)) * (1 - pOut) * 0.92;
  if (sc > 0) {
    ctx.save(); ctx.translate(cx, cy + pOut * 60); ctx.scale(sc, sc);
    ctx.rotate((1 - pIn) * -0.7 + Math.sin(t * 3) * 0.03);

  // テキスト
  const tx = 840, dx = (1 - pIn) * 160 - pOut * 220;

  text('No.' + num, tx, 300, { size: 50, fam: DISP, color: C.mustard });
  const nsz = Math.min(150, Math.floor(960 / [...v.n].length));
  text(v.n, tx - 6, 460, { size: nsz, fam: DISP, color: C.cream });
  ctx.restore();

  let px = tx;
  ctx.save(); ctx.globalAlpha = 1 - pOut;
  px += pill(v.m, px, 505, { size: 32, bg: C.orange, p: P(u, 0.15, 0.4) }) + 14;
  if (BEGIN.has(v.n)) px += pill('初心者向け', px, 505, { size: 32, bg: C.mustard, color: C.ink, p: P(u, 0.22, 0.47) }) + 14;
  if (PLANTER.has(v.n)) px += pill('プランターOK', px, 505, { size: 32, bg: C.leaf, color: C.ink, p: P(u, 0.29, 0.54) }) + 14;
  ctx.restore();

  ctx.save(); ctx.globalAlpha = vis; ctx.translate(dx * 0.5, 0);
  ctx.fillStyle = C.mustard; ctx.fillRect(tx, 618, 8, 56);
  text(v.pt, tx + 28, 664, { size: 48, color: C.cream });
  ctx.restore();

  // 栽培カレンダー
  const rowY = [800, 872];
  ctx.save();
  text('まく・植える', 840, rowY[0] + 26, { size: 26, color: 'rgba(246,236,220,.7)' });
  text('収穫', 840, rowY[1] + 26, { size: 26, color: 'rgba(246,236,220,.7)' });
  for (let m = 7; m < 19; m++) {
    const lab = ((m - 1) % 12) + 1;
    text(String(lab) + (m === 7 || m === 13 ? '月' : ''), mx(m + 0.5), 770, { size: 24, w: 700, color: 'rgba(246,236,220,.6)', align: 'center' });
    ctx.fillStyle = m % 2 ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.03)';
    ctx.fillRect(mx(m), 788, TL.w / 12, 136);

  const bar = (ranges, y, col) => (ranges || []).forEach(([a, b]) => {
    const w = (mx(b) - mx(a)) * g;

    ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(mx(a), y, w, 36, 10); ctx.fill();
  });
  bar(v.sow, rowY[0], C.orange);
  bar(v.pl, rowY[0], C.mustard);
  bar(v.hv, rowY[1], C.leaf);

    text(s, lx + 36, 1035, { size: 24, w: 700, color: 'rgba(246,236,220,.75)' });
    setFont(24, SANS, 700); lx += 36 + ctx.measureText(s).width + 34;
  }
  ctx.restore();
}

    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 22); ctx.fill();

      ctx.globalAlpha = pick;
      ctx.fillStyle = selB > 0 ? C.orange : C.green;

      ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-3, 10); ctx.lineTo(14, -10); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  });
}

function taskIcon(i, t) {
  ctx.strokeStyle = C.cream; ctx.fillStyle = C.cream; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (i === 0) { // スコップ
    ctx.rotate(-0.6 + Math.sin(t * 4) * 0.12);
    ctx.beginPath(); ctx.moveTo(0, -70); ctx.lineTo(0, 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-18, -70); ctx.lineTo(18, -70); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30, 10); ctx.lineTo(30, 10); ctx.lineTo(24, 50); ctx.quadraticCurveTo(0, 80, -24, 50); ctx.closePath(); ctx.fill();
  } else if (i === 1) { // 防虫ネット
    ctx.beginPath(); ctx.arc(0, 40, 70, Math.PI, 0); ctx.stroke();
    ctx.lineWidth = 4;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(0, 40, Math.abs(k) * 17, 70, 0, Math.PI, 0); ctx.stroke(); }
    for (const yy of [0, 20]) { const hw = Math.sqrt(70 * 70 - (40 - yy) * (40 - yy)); ctx.beginPath(); ctx.moveTo(-hw, yy); ctx.lineTo(hw, yy); ctx.stroke(); }
    ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(-85, 40); ctx.lineTo(85, 40); ctx.stroke();
  } else if (i === 2) { // 台風
    ctx.rotate(-t * 3);
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 4; a += 0.1) { const r = 6 + a * 5.5; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.stroke();
  } else {
    drawSnow(0, 0, 66, t * 0.8, C.cream, 9);
  }
}

function dropLine(s, cx, y, size, color, start, stagger) {
  setFont(size, DISP);
  const chars = [...s];
  const ws = chars.map(c => ctx.measureText(c).width);
  let x = cx - ws.reduce((a, b) => a + b, 0) / 2;
  chars.forEach((c, j) => {
    const p = P(lt_, start + j * stagger, start + j * stagger + 0.45);
    if (p > 0) {
      const e = eOutBack(p);
      ctx.save(); ctx.translate(x + ws[j] / 2, y - size * 0.35);
      ctx.scale(e, e); ctx.rotate((1 - eOutExpo(p)) * 0.6);
      ctx.globalAlpha = clamp(p * 3);
      setFont(size, DISP); ctx.fillStyle = color; ctx.textAlign = 'center';
      ctx.fillText(c, 0, size * 0.35);
      ctx.restore();
    }
    x += ws[j];
  });
}
let lt_ = 0;

function s6Outro(lt, t) {
  lt_ = lt;
  ctx.fillStyle = C.orange; ctx.fillRect(0, 0, W, H);
  rings(W / 2, 540, t, C.cream, 0.3);
  fallingLeaves(t, 0.8);
  dropLine('寒くなるほど、', W / 2, 430, 130, C.cream, 0.3, 0.06);
  dropLine('うまくなる。', W / 2, 690, 230, C.ink, 0.85, 0.08);
  const fp = P(lt, 1.9, 2.4);
  ctx.save(); ctx.globalAlpha = fp;
  ctx.fillStyle = C.ink;
  setFont(54, SANS, 900);
  const msg = '秋の菜園、いまが始めどき。';
  const mw = ctx.measureText(msg).width + 80;
  ctx.beginPath(); ctx.roundRect(W / 2 - mw / 2, 770, mw * eOutExpo(fp), 96, 48); ctx.fill();
  ctx.restore();
  text(msg, W / 2, 836, { size: 54, color: C.mustard, align: 'center', alpha: P(lt, 2.2, 2.6) });
  text('参考：PLANTIA（ハイポネックス）「【家庭菜園】秋に植える野菜20選」', W / 2, 1030, { size: 26, w: 500, color: C.cream, align: 'center', alpha: P(lt, 2.6, 3.0) * 0.9 });
}

// ---------- transitions ----------
function wipe(t, tb, cols) {
  const d = 0.9, p0 = (t - (tb - d / 2)) / d;
  if (p0 <= 0 || p0 >= 1.1) return;
  const bh = H / 4;
  for (let i = 0; i < 4; i++) {
    const p = clamp(p0 + (1.5 - i) * 0.03);
    if (p <= 0 || p >= 1) continue;
    const x = lerp(-4000, 2200, eInOut(p));
    ctx.fillStyle = cols[i % cols.length];
    ctx.beginPath();
    ctx.moveTo(x + 120, i * bh - 1); ctx.lineTo(x + 3840 + 120, i * bh - 1);
    ctx.lineTo(x + 3840, (i + 1) * bh + 1); ctx.lineTo(x, (i + 1) * bh + 1); ctx.fill();
  }
}

const SCENES = [
  { s: 0, f: s1Intro },
  { s: 5, f: s2Merits },
  { s: 12, f: s3Veg },
  { s: 37, f: s4Grid },
  { s: 45, f: s5Tasks },
  { s: 52, f: s6Outro },
];
const WIPES = [
  [5, [C.ink, C.mustard, C.cream, C.ink]],
  [12, [C.orange, C.ink, C.mustard, C.orange]],
  [37, [C.mustard, C.orange, C.cream, C.mustard]],
  [45, [C.green, C.ink, C.leaf, C.green]],
  [52, [C.orange, C.mustard, C.ink, C.orange]],
];

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.setLineDash([]);
  let sc = SCENES[0];
  for (const s of SCENES) if (t >= s.s) sc = s;
  ctx.save(); sc.f(t - sc.s, t); ctx.restore();
  for (const [tb, cols] of WIPES) wipe(t, tb, cols);
}

// ---------- boot ----------
window.DURATION = DURATION; window.FPS = FPS; window.render = render;
window.frameJPEG = t => { render(t); return cv.toDataURL('image/jpeg', 0.95).split(',')[1]; };
(async () => {
  const src = document.getElementById('main').textContent;
  await Promise.all([
    document.fonts.load(`400 100px "Dela Gothic One"`, src),
    document.fonts.load(`500 100px "Noto Sans JP"`, src),
    document.fonts.load(`700 100px "Noto Sans JP"`, src),
    document.fonts.load(`900 100px "Noto Sans JP"`, src),
  ]);
  await document.fonts.ready;
  window.__ready = true;
  if (new URLSearchParams(location.search).has('render')) return;
  const t0 = performance.now();
  const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script>
