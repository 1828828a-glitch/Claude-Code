<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みらキャン リール</title>
<link rel="stylesheet" href="style.css">
<script src="../vendor/gsap.min.js"></script>
<script src="engine.js"></script>
<script src="icons.js"></script>
<script src="reels_data.js"></script>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="ui">
  <select id="pick" aria-label="リールを選ぶ"><option>R01</option><option>R02</option><option>R03</option><option>R04</option><option>R05</option><option>R06</option><option>R07</option><option>R08</option><option>R09</option></select>
  <button id="btnPlay" aria-label="再生・一時停止">❚❚</button>
  <button id="btnRestart" aria-label="最初から">↺</button>
  <input id="seek" type="range" min="0" max="20" step="0.01" value="0" aria-label="再生位置">
  <span id="time">0.0 / 0.0</span>
  <button id="btnSafe">安全領域</button>
</div>
<script>loadReel();</script>
</body>
</html>
