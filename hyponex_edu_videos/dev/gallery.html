<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Gallery</title>
<link rel="stylesheet" href="../src/fonts.css">
<style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { loadFonts, loadImages } from '../src/engine/assets.js';
const params = new URLSearchParams(location.search);
const which = params.get('g') || 'chars';
const mod = await import('./gallery.js');
await loadFonts('../');
const images = await loadImages('../');
const c = document.getElementById('c');
const { w, h } = mod.size(which);
c.width = w; c.height = h;
const ctx = c.getContext('2d');
mod.draw(which, ctx, images, Number(params.get('t') || 0));
window.__done = true;
</script></body></html>
