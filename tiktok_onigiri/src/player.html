<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"ZenMaru";src:url("../fonts/ZenMaruGothic-Medium.ttf");font-weight:500}
@font-face{font-family:"ZenMaru";src:url("../fonts/ZenMaruGothic-Bold.ttf");font-weight:700}
@font-face{font-family:"ZenMaru";src:url("../fonts/ZenMaruGothic-Black.ttf");font-weight:900}
@font-face{font-family:"Klee";src:url("../fonts/KleeOne-SemiBold.ttf");font-weight:600}
@font-face{font-family:"Yomogi";src:url("../fonts/Yomogi-Regular.ttf");font-weight:400}
@font-face{font-family:"ZenKaku";src:url("../fonts/ZenKakuGothicNew-Medium.ttf");font-weight:500}
@font-face{font-family:"ZenKaku";src:url("../fonts/ZenKakuGothicNew-Bold.ttf");font-weight:700}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="core.js"></script>
<script src="chars.js"></script>
<script src="props.js"></script>
<script src="bgs.js"></script>
<script src="ui.js"></script>
<script src="timeline.js"></script>
<script src="shots.js"></script>
<script src="shots2.js"></script>
<script>
(async () => {
  const v = new URLSearchParams(location.search).get('v');
  await Promise.all([
    ['500 20px "ZenMaru"'], ['700 20px "ZenMaru"'], ['900 20px "ZenMaru"'], ['600 20px "Klee"'],
    ['400 20px "Yomogi"'], ['500 20px "ZenKaku"'], ['700 20px "ZenKaku"'],
  ].map(([f]) => document.fonts.load(f, 'あア亜A')));
  const s = document.createElement('script');
  s.src = `videos/${v}.js`;
  s.onload = () => { window.READY = true; };
  s.onerror = e => { window.READY = 'error'; };
  document.body.appendChild(s);
})();
const CANVAS = document.getElementById('c');
const CTX = CANVAS.getContext('2d');
function frameAt(t, type = 'image/jpeg', q = 0.95) {
  renderVideo(CTX, window.VIDEO, t);
  return CANVAS.toDataURL(type, q);
}
</script>
</body></html>
